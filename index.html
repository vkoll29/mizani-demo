<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A clickable prototype of Mizani, a grant finance workspace for NGOs. Every figure in it is invented.">
<title>Mizani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: slim header with working controls, left rail for the four working screens, one main area, a ledger drawer that slides over from the right. */
:root{
  --bg:#F5F1EB; --surface:#FFFFFF; --surface2:#ECE5DC; --ink:#2B211A; --muted:#6B5D52; --line:#DDD2C6;
  --accent:#6B4A32; --accent-soft:#EFE3D6; --accent-ink:#FFFFFF;
  --good:#17754A; --good-bg:#DDF3E6; --warn:#8F5200; --warn-bg:#FCEFD0; --crit:#B42318; --crit-bg:#FDE2DE;
  --shadow:0 8px 30px rgba(43,33,26,.18);
  --display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#1B1612; --surface:#251E19; --surface2:#2F2620; --ink:#F2EBE4; --muted:#B9A99B; --line:#3C3029;
  --accent:#D8B08C; --accent-soft:#3A2B20; --accent-ink:#1B1612;
  --good:#5BD08E; --good-bg:#12332A; --warn:#F0B24B; --warn-bg:#3A2C10; --crit:#FF8A80; --crit-bg:#3F1C1A;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.shell{max-width:1240px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="checkbox"]{accent-color:var(--accent)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1}
.org{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.org span:first-child{font-weight:600}
.org span:last-child{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 28px 6px 10px;min-height:34px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;margin-bottom:14px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.banner.info{background:var(--accent-soft);border-color:transparent}
.banner button{margin-left:auto}

/* layout */
.layout{display:grid;grid-template-columns:208px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:6px;font-weight:500}
.rail button:hover{background:var(--surface2)}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .badge{background:var(--crit);color:var(--surface);border-radius:99px;font-size:11.5px;min-width:20px;text-align:center;padding:0 6px}
.rail h6{margin:16px 12px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.rail .later{padding:6px 12px;color:var(--muted);font-size:13px}
main{min-width:0}
h1{font-family:var(--display);font-size:26px;line-height:1.15;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-size:18px;margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.panel>h2:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.stat strong{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat span{color:var(--muted);font-size:12px}
.stat.neg strong{color:var(--crit)}

/* tables */
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
.tbl{min-width:820px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.num{text-align:right}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.l1 td{font-weight:600;background:var(--surface)}
.tbl tr.l2 td{background:var(--surface2)}
.tbl tr.l2 td:first-child{padding-left:38px}
.tbl tr.tot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.tbl tr.l2:hover td,.tbl tr.l1:hover td{background:var(--accent-soft)}
.name{display:flex;align-items:center;gap:8px}
.name small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chev{border:0;background:transparent;width:24px;height:24px;border-radius:4px;color:var(--muted);flex:none;line-height:1}
.chev:hover{background:var(--line)}
.link{border:0;background:transparent;padding:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:2px;font-weight:inherit}
.neg{color:var(--crit)}
.bar{position:relative;height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:3px;min-width:110px}
.l2 .bar{background:var(--surface)}
.bar i{position:absolute;top:0;bottom:0;left:0}
.bar .a{background:var(--accent)}
.bar .c{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,transparent 3px 6px);opacity:.55}
.bar .p{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bar.over{border-color:var(--crit)}
.usedcell{display:flex;align-items:center;gap:8px}
.usedcell span{width:40px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.none{background:var(--surface2);color:var(--muted)}
.pill.ok::before,.pill.fix::before{display:none}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.fix{background:var(--crit-bg);color:var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12.5px;margin:6px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px}
.sw.a{background:var(--accent)}.sw.c{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,transparent 3px 6px);border:1px solid var(--accent)}
.sw.p{width:2px;height:12px;background:var(--ink)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11.5px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bud{fill:none;stroke:var(--muted);stroke-width:1.75;stroke-dasharray:5 4}
.chart .act{fill:none;stroke:var(--accent);stroke-width:2.75;stroke-linejoin:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .lbl{fill:var(--ink);font-weight:600}

/* budgets grid */
.grid{min-width:1060px}
.grid th{font-size:11.5px;color:var(--muted);font-weight:500;padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.grid th:first-child,.grid tbody th{text-align:left;white-space:nowrap;padding-right:12px}
.grid tbody th{font-weight:500;font-size:13.5px;padding-block:3px;border-bottom:1px solid var(--line)}
.grid td{padding:3px 2px;border-bottom:1px solid var(--line)}
.cell{width:68px;text-align:right;font-variant-numeric:tabular-nums;border:1px solid transparent;background:var(--surface2);border-radius:4px;padding:5px 6px}
.cell:hover:not(:disabled){border-color:var(--line)}
.cell:disabled{background:transparent;color:var(--ink);opacity:1}
.cell.chg{background:var(--warn-bg);border-color:var(--warn)}
.calc{padding:5px 8px!important;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.grid td.tot{font-weight:600;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid tr.sum td,.grid tr.sum th{border-top:2px solid var(--line);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;min-height:34px;font-weight:500}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px}
.note{font-size:12.5px;color:var(--muted)}
.log{margin:0;padding:0;list-style:none;font-size:13px}
.log li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log li span:first-child{color:var(--muted);min-width:70px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cols .panel{margin-bottom:0}

/* simple tables */
.st{min-width:560px}
.st th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.st td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.st th.inm,.st td.inm{background:var(--accent-soft)}
.fixrow select{min-height:30px;padding:3px 24px 3px 8px}
.fixrow label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin:4px 0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(27,22,18,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header h2{margin:0;flex:1}
.drawer .body{padding:14px 18px;overflow:auto;flex:1}
.x{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:34px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (max-width:880px){
  .layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .rail button{white-space:nowrap}
  .rail h6,.rail .later{display:none}
  .spacer{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
<style>
/* what the claude.ai page wrapper normally supplies */
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <b>Mizani</b>
    </div>
    <div class="org"><span>Demo NGO, Kenya Country Office</span><span>FY2026, January to December, closed to September</span></div>
    <span class="tag" title="Every figure in this prototype is invented">Synthetic data</span>
    <div class="spacer"></div>
    <div class="ctl">
      <div class="field"><label for="role">Viewing as</label>
        <select id="role" data-change="role"></select></div>
      <div class="field"><label id="curl">Show amounts in</label>
        <div class="seg" role="group" aria-labelledby="curl">
          <button type="button" data-act="cur" data-arg="USD" id="cur-USD">USD</button>
          <button type="button" data-act="cur" data-arg="KES" id="cur-KES">KES</button></div></div>
      <div class="field"><label id="thl">Theme</label>
        <div class="seg" role="group" aria-labelledby="thl">
          <button type="button" data-act="theme" data-arg="light" id="th-light">Light</button>
          <button type="button" data-act="theme" data-arg="dark" id="th-dark">Dark</button></div></div>
      <div class="field"><label id="conl">Connection</label>
        <div class="seg" role="group" aria-labelledby="conl">
          <button type="button" data-act="net" data-arg="on" id="net-on">Online</button>
          <button type="button" data-act="net" data-arg="off" id="net-off">Offline</button></div></div>
    </div>
  </div>

  <div id="banners"></div>

  <div class="layout">
    <nav class="rail" aria-label="Screens" id="rail"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="drawerHost"></div>
<div id="toastHost" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- constants and synthetic data ---------- */
var FX=130, CLOSED=9;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var HUBS=[{id:'NBO',name:'Nairobi'},{id:'GRS',name:'Garissa'},{id:'KSM',name:'Kisumu'}];
var GRANTS=[
  {id:'NUT',name:'Child Nutrition',donor:'Bilateral donor A',span:'Jan 2025 to Dec 2027'},
  {id:'WSH',name:'Water and Hygiene',donor:'Foundation B',span:'Jul 2025 to Jun 2027'},
  {id:'EDU',name:'Girls Education',donor:'Trust C',span:'Jan 2026 to Dec 2028'}];
var LINES=[
  {id:'PER',name:'Personnel'},{id:'TRV',name:'Travel and transport'},{id:'SUP',name:'Supplies and equipment'},
  {id:'PTN',name:'Partner grants'},{id:'IND',name:'Indirect costs (10%)'}];
var ROLES=[
  {id:'cfl',name:'Country finance lead',hubs:['NBO','GRS','KSM'],edit:true,approve:true,salary:true,short:'Country lead'},
  {id:'hfm',name:'Garissa hub finance manager',hubs:['GRS'],edit:true,approve:false,salary:true,short:'Garissa manager'},
  {id:'pm',name:'Programme manager (read-only)',hubs:['NBO','GRS','KSM'],edit:false,approve:false,salary:false,short:'Programme manager'}];
var ACCT_NAME={'5100':'Salaries','5110':'Staff allowances','5200':'Travel and fuel','5300':'Supplies','5350':'Training costs','5400':'Equipment','5500':'Partner transfers','5900':'Indirect allocation'};
var hubName={},grantName={},lineName={};
HUBS.forEach(function(h){hubName[h.id]=h.name});GRANTS.forEach(function(g){grantName[g.id]=g.name});LINES.forEach(function(l){lineName[l.id]=l.name});

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=rng(2026);
function pad(n){return n<10?'0'+n:''+n}
function spread(total){var q=Math.floor(total/12),a=[],i;for(i=0;i<12;i++)a.push(q);a[11]+=total-q*12;return a}
function clone(o){return JSON.parse(JSON.stringify(o))}
function indirect(m){var a=[],i,cum=0,prev=0;for(i=0;i<12;i++){cum+=m.PER[i]+m.TRV[i]+m.SUP[i]+m.PTN[i];var c=Math.round(0.1*cum);a.push(c-prev);prev=c}return a}
function sum(a,n){if(!a)return 0;var s=0,i,e=n==null?12:n;for(i=0;i<e&&i<a.length;i++)s+=a[i];return s}

var BASE={
  'NUT|GRS':{PER:96000,TRV:30000,SUP:84000,PTN:48000},
  'NUT|NBO':{PER:60000,TRV:14000,SUP:36000,PTN:30000},
  'WSH|GRS':{PER:72000,TRV:24000,SUP:120000,PTN:36000},
  'WSH|KSM':{PER:54000,TRV:18000,SUP:96000,PTN:24000},
  'EDU|KSM':{PER:66000,TRV:20000,SUP:48000,PTN:40000},
  'EDU|NBO':{PER:78000,TRV:16000,SUP:30000,PTN:36000}};
/* BASE is the original size in USD; SCALE brings the demo to about USD 4.5 million (KES 590 million) a year */
var SCALE=3.5;
var B={};
Object.keys(BASE).forEach(function(k){
  var m={};['PER','TRV','SUP','PTN'].forEach(function(l){m[l]=spread(Math.round(BASE[k][l]*SCALE))});m.IND=indirect(m);
  B[k]={approved:m,draft:clone(m),status:'approved',version:2};
});
/* how closely each cell follows its budget; anything missing runs at 96% */
var F={'NUT|GRS|SUP':1.18,'NUT|GRS|PER':1.02,'WSH|GRS|TRV':0.5,'WSH|KSM|SUP':1.12,'EDU|KSM|PTN':0.35,'EDU|NBO|PER':1.04,'NUT|NBO|PTN':0.8};
function fac(k){return F[k]!=null?F[k]:0.96}
var DESCR={
  '5100':['Salaries, programme staff'],
  '5110':['Staff allowances'],
  '5200':['Field travel and fuel','Vehicle hire','Per diem, field visit','Fuel for programme vehicles','Staff transport, monitoring visit','Airfare and accommodation'],
  '5300':{NUT:['Therapeutic food and supplements','Micronutrient supplements','Nutrition screening kits','Cold chain consumables'],
          WSH:['Pipes, pumps and fittings','Borehole drilling materials','Water treatment chemicals','Sanitation slabs and latrine kits'],
          EDU:['Learning kits and materials','School uniforms and sanitary packs','Textbooks and readers','Stationery and exercise books']},
  '5400':['Equipment and devices','Laptops and tablets','Solar lighting units','Field equipment'],
  '5500':['Partner sub-grant instalment','Partner sub-grant, community organisation','Partner capacity grant']};
/* how many separate postings one month's spend on an account is split into, as [fewest, most] */
var SPLIT={'5100':[1,1],'5110':[1,1],'5200':[4,9],'5300':[3,7],'5400':[1,3],'5500':[1,2]};
var ACC={PER:[['5100',.88],['5110',.12]],TRV:[['5200',1]],SUP:[['5300',.7],['5400',.3]],PTN:[['5500',1]]};
var DIM=[31,28,31,30,31,30,31,31,30,31,30,31];
var raw=[];
function pick(a){return a[Math.floor(rnd()*a.length)]}
function describe(acct,g){var d=DESCR[acct];return pick(Array.isArray(d)?d:d[g])}
/* split a total into n positive amounts that add up exactly, in whole tens of shillings */
function parts(total,n){
  var w=[],s=0,i,out=[],used=0;
  for(i=0;i<n;i++){var x=0.4+rnd();w.push(x);s+=x}
  for(i=0;i<n-1;i++){var v=Math.round(total*w[i]/s/10)*10;out.push(v);used+=v}
  out.push(total-used);return out;
}
(function(){
  var m;
  for(m=1;m<=10;m++){
    var scale=m===10?0.45:1;
    Object.keys(B).forEach(function(key){
      var g=key.split('|')[0],h=key.split('|')[1],direct=0;
      ['PER','TRV','SUP','PTN'].forEach(function(l){

function agg(f){
  var b=0,btd=0,a=0,c=0,P=S.period;
  Object.keys(B).forEach(function(key){
    var p=key.split('|'),g=p[0],h=p[1];
    if(f.g&&f.g!==g)return;if(f.h&&f.h!==h)return;if(!hubOK(h))return;
    LINES.forEach(function(l){
      if(f.l&&f.l!==l.id)return;
      var m=B[key].approved[l.id],kk=key+'|'+l.id;
      b+=sum(m);btd+=sum(m,P);a+=sum(A[kk],P);c+=sum(Cm[kk],P);
    });
  });
  return{b:b,btd:btd,a:a,c:c,av:b-a-c};
}
function status(x){
  if(x.b<=0)return['none','No budget'];

  var r=x.btd>0?x.a/x.btd:0;
  if(r>1.1)return['warn','Ahead of pace'];
  if(r<0.7)return['warn','Behind pace'];

}

/* chart */
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x))),n=x/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
function chart(f){
  var mb=[],ma=[],i,P=S.period;
  for(i=0;i<12;i++){mb.push(0);ma.push(0)}
  Object.keys(B).forEach(function(key){
    var p=key.split('|');if(f.g&&f.g!==p[0])return;if(f.h&&f.h!==p[1])return;if(!hubOK(p[1]))return;
    LINES.forEach(function(l){for(i=0;i<12;i++){mb[i]+=B[key].approved[l.id][i];ma[i]+=(A[key+'|'+l.id]?A[key+'|'+l.id][i]:0)}});
  });
  var cb=[],ca=[],sb=0,sa=0;
  for(i=0;i<12;i++){sb+=mb[i];cb.push(sb*k());if(i<P){sa+=ma[i];ca.push(sa*k())}}
  var mx=Math.max(cb[11],ca[ca.length-1]||0)*1.04||1,step=niceStep(mx/4),ymax=Math.ceil(mx/step)*step;
  var W=720,H=250,L=56,R=28,T=16,Bm=32;
  function x(j){return L+(W-L-R)*j/11}
  function y(v){return T+(H-T-Bm)*(1-v/ymax)}
  var g='',v;
  for(v=0;v<=ymax+1e-6;v+=step){g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmtC(v/k())+'</text>'}
  for(i=0;i<12;i++)g+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+MONTHS[i]+'</text>';
  var pb=cb.map(function(c,j){return(j?'L':'M')+x(j).toFixed(1)+' '+y(c).toFixed(1)}).join(' ');
  var pa=ca.map(function(c,j){return(j?'L':'M')+x(j).toFixed(1)+' '+y(c).toFixed(1)}).join(' ');
  var last=ca.length-1;
  g+='<path class="bud" d="'+pb+'"/><path class="act" d="'+pa+'"/>';
  for(i=0;i<ca.length;i++)if(i===last)g+='<circle class="dot" cx="'+x(i)+'" cy="'+y(ca[i])+'" r="5"><title>'+MONTHS[i]+': '+fmt(ca[i]/k())+' '+S.cur+' spent to date</title></circle>';
  g+='<text class="lbl" x="'+(x(last)-8)+'" y="'+(y(ca[last])-12)+'" text-anchor="end">'+fmtC(ca[last]/k())+' spent</text>';
  g+='<text x="'+(x(11))+'" y="'+(y(cb[11])-8)+'" text-anchor="end">'+fmtC(cb[11]/k())+' budget</text>';
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative actual spend of '+fmtC(ca[last]/k())+' '+S.cur+' to '+MONTHS[last]+' against a full-year budget of '+fmtC(cb[11]/k())+'">'+g+'</svg>';
}

function parseNum(s){var v=Number(String(s).replace(/[,\s ]/g,''));return isFinite(v)&&v>=0?Math.round(v):NaN}
var TOK={PER:'personnel',TRV:'travel',SUP:'suppl',PTN:'partner'};
function applyText(text){
  var d=B[bkey()].draft,ok=0,skip=0,lines=text.split(/\r?\n/).filter(function(x){return x.trim()});
  lines.forEach(function(ln){
    var cells=ln.indexOf('\t')>-1?ln.split('\t'):ln.split(',');
    var name=(cells[0]||'').toLowerCase(),id=null;
    Object.keys(TOK).forEach(function(x){if(name.indexOf(TOK[x])>-1)id=x});
    var vals=cells.slice(1).map(parseNum).filter(function(v){return !isNaN(v)});
    if(!id||!vals.length){skip++;return}
    if(vals.length===1)d[id]=spread(vals[0]);
    else if(vals.length>=12)d[id]=vals.slice(0,12);
    else{skip++;return}
    ok++;
  });
  return{ok:ok,skip:skip};
}

  else if(act==='net'){
    var was=S.offline;S.offline=(arg==='off');
    if(was&&!S.offline){var q=Object.keys(S.queue).length;if(q){logIt('synced '+q+' offline edit'+(q>1?'s':''));toast('Back online. Synced '+q+' change'+(q>1?'s':'')+' with no conflicts.')}else toast('Back online.');S.queue={}}
    else if(!was&&S.offline)toast('Offline. You can keep editing budgets on this device.');
    render();
  }
  else if(act==='mode'){S.mode=arg;render()}
  else if(act==='toggle'){S.open[arg]=!S.open[arg];render()}
  else if(act==='drill'){openDrawer(arg)}
  else if(act==='close'){S.drawer=null;renderDrawer()}
  else if(act==='src'){S.ledgerSrc=arg;render()}
  else if(act==='refresh'){toast('Up to date. No new entries since 07:00.')}
  else if(act==='pastetoggle'){S.paste=!S.paste;S.pasteMsg='';render()}
  else if(act==='samplepaste'){
    var d=B[bkey()].approved;
    S.pasteText=['PER','TRV','SUP','PTN'].map(function(l){return lineName[l].split(' ')[0]+'\t'+d[l].map(function(v,i){return i>=9?Math.round(v*1.08):v}).join('\t')}).join('\n');
    S.pasteMsg='Sample filled in: the last three months are 8% higher than approved. Press Apply to draft.';render();
  }
  else if(act==='applypaste'){
    var r=applyText(S.pasteText);
    if(r.ok){markEdited();logIt('imported '+r.ok+' budget line'+(r.ok>1?'s':'')+' from Excel for '+grantName[S.bg]+', '+hubName[S.bh]);S.compare=true;
      if(S.offline)S.queue[bkey()+':import']=1}
    S.pasteMsg=r.ok?'Applied '+r.ok+' line'+(r.ok>1?'s':'')+' to the draft'+(r.skip?', skipped '+r.skip+' row'+(r.skip>1?'s':'')+' it could not read':'')+'. Changes are highlighted below.':'Nothing applied. Check that each row starts with a budget line and has one or twelve numbers.';
    render();
  }
  else if(act==='submit'){B[bkey()].status='submitted';logIt('submitted '+grantName[S.bg]+', '+hubName[S.bh]+' for review');toast('Submitted. The country finance lead will see it.');render()}
  else if(act==='approve'){b=B[bkey()];b.approved=clone(b.draft);b.approved.IND=indirect(b.approved);b.version++;b.status='approved';logIt('approved '+grantName[S.bg]+', '+hubName[S.bh]+' as v'+b.version);toast('Approved as v'+b.version+'. Budget vs actual now uses it.');render()}
  else if(act==='return'){B[bkey()].status='draft';logIt('returned '+grantName[S.bg]+', '+hubName[S.bh]+' to the hub');toast('Returned to the hub for changes.');render()}
  else if(act==='discard'){b=B[bkey()];b.draft=clone(b.approved);b.status='approved';logIt('discarded draft changes for '+grantName[S.bg]+', '+hubName[S.bh]);render()}
  else if(act==='fix'){
    var id=Number(arg),e=entries.filter(function(x){return x.id===id})[0],m=e.map,rem=$('fx-r-'+id),remember=rem?rem.checked:false,n=0;
    if(m.need==='grant'){
      var gv=$('fx-g-'+id).value;if(!gv){toast('Choose a grant first.');return}
      if(remember&&!m.blank){grantMap[e.grant]=gv;added.grant[e.grant]=true}
      else{var ln=acctMap[e.acct];over[id]={ok:true,grant:gv,hub:ccMap[e.cc],line:ln}}
    }else if(m.need==='line'){
      var lv=$('fx-l-'+id).value;if(!lv){toast('Choose a budget line first.');return}
      if(remember){acctMap[e.acct]=lv;added.acct[e.acct]=true}
      else over[id]={ok:true,grant:grantMap[e.grant],hub:ccMap[e.cc],line:lv};
    }
    var before=unm.length;recompute();n=before-unm.length;
    logIt('mapped '+n+' ledger entr'+(n===1?'y':'ies'));
    toast(n+' entr'+(n===1?'y':'ies')+' mapped and now counted in budget vs actual.');render();
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target,c=t.getAttribute&&t.getAttribute('data-change');if(!c)return;
  if(c==='role'){S.role=t.value;S.scope=role().hubs.length===1?role().hubs[0]:'';S.drawer=null;render()}
  else if(c==='scope'){S.scope=t.value;render()}
  else if(c==='grant'){S.grant=t.value;render()}
  else if(c==='period'){S.period=Number(t.value);render()}
  else if(c==='bgrant'){S.bg=t.value;render()}
  else if(c==='bhub'){S.bh=t.value;render()}
  else if(c==='compare'){S.compare=t.checked;patchGrid()}
  else if(c==='budgetfile'||c==='ledgerfile'){
    var fl=t.files&&t.files[0];if(!fl)return;
    var rd=new FileReader();
    rd.onload=function(){
      var text=String(rd.result);
      if(c==='budgetfile'){S.pasteText=text;var r=applyText(text);if(r.ok){markEdited();logIt('imported '+r.ok+' budget line'+(r.ok>1?'s':'')+' from file '+fl.name);S.compare=true}
        S.pasteMsg=r.ok?'Applied '+r.ok+' line'+(r.ok>1?'s':'')+' from '+fl.name+(r.skip?', skipped '+r.skip:'')+'.':'No budget lines found in '+fl.name+'.'}
      else{var lines=text.split(/\r?\n/).filter(function(x){return x.trim()});var cols=(lines[0]||'').split(/,|\t/).map(function(x){return x.trim().toLowerCase()});S.csv={name:fl.name,rows:Math.max(0,lines.length-1),cols:cols}}
      render();
    };
    rd.readAsText(fl);
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target,c=t.getAttribute&&t.getAttribute('data-input');if(!c)return;
  if(c==='paste'){S.pasteText=t.value;return}
  if(c==='cell'){
    var l=t.getAttribute('data-l'),i=Number(t.getAttribute('data-i')),v=parseNum(t.value);
    if(isNaN(v)){t.setAttribute('aria-invalid','true');return}
    t.removeAttribute('aria-invalid');
    var b=B[bkey()];b.draft[l][i]=v;
    if(S.offline)S.queue[bkey()+':'+l+i]=1;
    if(b.status==='approved'){
      /* the action buttons depend on status, so draw once and put the cursor back */
      b.status='draft';var pos=t.selectionStart,id=t.id;render();
      var again=$(id);if(again){again.focus();try{again.setSelectionRange(pos,pos)}catch(e){}}
    }else patchGrid();
  }
});
/* record a cell edit in the change log once the user leaves the field */
document.addEventListener('focusout',function(ev){
  var t=ev.target;if(!t.getAttribute||t.getAttribute('data-input')!=='cell')return;
  var b=B[bkey()],l=t.getAttribute('data-l'),i=Number(t.getAttribute('data-i'));
  if(b.draft[l][i]!==b.approved[l][i]&&t.dataset.logged!==String(b.draft[l][i])){
    logIt('edited '+lineName[l]+' for '+MONTHS[i]+' ('+grantName[S.bg]+', '+hubName[S.bh]+')');t.dataset.logged=String(b.draft[l][i]);
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.drawer){S.drawer=null;renderDrawer()}});

try{var hsh=(location.hash||'').replace('#','');if(['bva','budgets','ledger','maps'].indexOf(hsh)>-1)S.view=hsh}catch(e){}
try{var th=localStorage.getItem('mizani-theme');if(th==='dark'||th==='light')S.theme=th}catch(e){}
document.documentElement.setAttribute('data-theme',S.theme);
S.queue={};
render();
})();
</script>
</body>
</html>
